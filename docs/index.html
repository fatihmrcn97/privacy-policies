<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Privacy Policies</title>
<style>
:root{--bg:#fff;--fg:#1d1f23;--muted:#5b616b;--line:#e3e5e8;--accent:#1a5fd0;--soft:#f5f7fa}
@media (prefers-color-scheme:dark){:root{--bg:#121417;--fg:#e8eaed;--muted:#a0a6b0;--line:#2c3036;--accent:#7fb0ff;--soft:#1b1e22}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
main{max-width:780px;margin:0 auto;padding:32px 16px 64px}
h1{font-size:1.9rem;line-height:1.25;margin:0 0 4px}
h2{font-size:1.25rem;margin:2.2em 0 .5em;padding-top:.4em;border-top:1px solid var(--line)}
h3{font-size:1.05rem;margin:1.4em 0 .3em}
.meta{color:var(--muted);margin:0 0 24px}
a{color:var(--accent);overflow-wrap:anywhere}
table{width:100%;border-collapse:collapse;margin:12px 0;font-size:.94rem}
th,td{text-align:left;vertical-align:top;padding:8px 10px;border-bottom:1px solid var(--line)}
th{background:var(--soft)}
.tbl{overflow-x:auto}
.box{background:var(--soft);border:1px solid var(--line);border-radius:8px;padding:12px 16px;margin:16px 0}
nav ol{padding-left:1.2em;columns:2;column-gap:32px}
@media (max-width:560px){nav ol{columns:1}}
footer{margin-top:48px;color:var(--muted);font-size:.9rem}
</style></head>
<body>
<main>
<h1>Privacy Policies</h1>
<p class="meta">Privacy policies for our mobile games.</p>
<p>No policies published yet.</p>
</main>
</body>
</html>
