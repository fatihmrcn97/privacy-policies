# Third-party SDK library used by ppgen.
#
# Each key is the SDK id you list under `sdks:` in apps/<slug>.yaml.
# To add an SDK, copy an entry and fill every field. Run `python ppgen.py check-links`
# afterwards to make sure the URLs still resolve.
#
# Fields
#   name / company      Shown in the policy.
#   category            advertising | mediation | analytics | attribution | crash | payments | platform | social
#   privacy_url         The provider's own privacy policy (linked from the policy).
#   data_safety_url     The provider's Google Play "Data safety" disclosure guide, if one exists (used in the report).
#   families_listed     true  = known to appear on Google's Families Self-Certified Ads SDK list (still re-check).
#                       false/unknown = not confirmed; ppgen warns when the app targets children.
#   collects            Data type ids (see ppgen/model.py DATA_TYPES).
#   shared              true when Google Play counts the transfer as "sharing" (ad networks, attribution).
#                       false when the provider acts as a service provider for you (analytics, crash reporting).
#   purposes            Purpose ids (see ppgen/model.py PURPOSES).
#   uses_ad_id          true when the SDK reads the Android Advertising ID (needs the AD_ID permission declaration).
#   detect              How `ppgen detect` finds it in a Unity project:
#                         packages  -> keys in Packages/manifest.json
#                         paths     -> folders under the project root
#                         patterns  -> regexes searched in *Dependencies.xml, *.gradle and AndroidManifest files

admob:
  name: Google AdMob
  company: Google LLC
  category: advertising
  privacy_url: https://policies.google.com/privacy
  partner_url: https://policies.google.com/technologies/partner-sites
  data_safety_url: https://developers.google.com/admob/android/privacy/play-data-disclosure
  families_listed: true
  collects: [approx_location, device_ids, app_interactions, diagnostics, crash_logs]
  shared: true
  purposes: [advertising, analytics, fraud_prevention]
  uses_ad_id: true
  detect:
    packages: [com.google.ads.mobile]
    paths: [Assets/GoogleMobileAds]
    patterns: ['play-services-ads(?!-identifier)', 'admobadapter', 'googleadapter', 'mediation\.google']

unity_ads:
